[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-agent"
version = "1.0.0"
description = "Universal video downloader agent with automated locker page resolution and base64 decoding."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2023.0.0",
]

[project.scripts]
video-agent = "video_agent:main"
